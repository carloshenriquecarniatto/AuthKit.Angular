<main class="page">
  <header class="brand">
    <h1>AuthKit</h1>
    <p>POC against an isolated Supabase stack</p>
  </header>

  @if (!isAuthenticated()) {
    <section class="card">
      <ak-email
        [showConfirmPasswordField]="true"
        (signInComplete)="onSignedIn()"
        (signUpComplete)="onSignedIn()"
      />
    </section>

    <p class="hint">
      Sign up with any address: email confirmation is disabled in this stack. Password needs 8+
      characters.
    </p>
  } @else {
    <section class="card">
      <div class="who">
        <span
          >Signed in as <strong>{{ email() }}</strong></span
        >
        <button class="link" type="button" (click)="signOut()">Sign out</button>
      </div>

      <ak-demo-notes />
    </section>
  }
</main>
